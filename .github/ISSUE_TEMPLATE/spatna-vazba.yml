name: "Spätná väzba / návrh"
description: "Nápad na zlepšenie, chýbajúci vzorec, kalk alebo bohemizmus, pripomienka k slovenčine alebo všeobecná spätná väzba."
title: "[Spätná väzba]: "
labels: ["spätná väzba"]
body:
  - type: markdown
    attributes:
      value: "Vďaka, že pomáhaš skill zlepšovať! Povinné je len pole „O čo ide?“, ostatné vyplň, ak chceš."
  - type: textarea
    id: co
    attributes:
      label: "O čo ide?"
      description: "Opíš svoj návrh, postreh, chýbajúci vzorec alebo výraz do slovníka kalkov."
      placeholder: "Napr. skill by mal strážiť aj…"
    validations:
      required: true
  - type: textarea
    id: priklad
    attributes:
      label: "Príklad textu (nepovinné)"
      description: "Vlož ukážku textu a napíš, ako by mal vyzerať po úprave."
      render: markdown
  - type: dropdown
    id: prostredie
    attributes:
      label: "Kde skill používaš?"
      options:
        - "Claude (web/aplikácia)"
        - "Claude Code (plugin)"
        - "ChatGPT"
        - "Gemini"
        - "Copilot alebo iný chatbot"
        - "Skills CLI / iný agent"
        - "Inde / neviem"
